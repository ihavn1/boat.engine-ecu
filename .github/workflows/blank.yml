name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and coverage tools
        run: python -m pip install platformio gcovr==7.2

      - name: Run engine-hours tests with coverage
        run: pio test -e native-coverage -f test_engine_hours

      - name: Enforce domain coverage
        run: >-
          python -m gcovr
          --root .
          --object-directory .pio/build/native-coverage
          --filter "src/(engine_hours_counter|shutdown_coordinator)\\.cpp"
          --txt-metric branch
          --html-details coverage.html
          --xml coverage.xml
          --fail-under-line 100
          --fail-under-branch 100

      - name: Build ESP32 firmware
        run: pio run -e az-delivery-devkit-v4

      - uses: actions/upload-artifact@v4
        with:
          name: engine-hours-coverage
          path: |
            coverage.css
            coverage.html
            coverage.*.html
            coverage.xml
